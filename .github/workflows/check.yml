name: Validate application
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: python -m pytest -q
      - run: npm run build
      - run: python scripts/verify_release.py
      - run: python scripts/verify_transit.py
      - run: python scripts/audit_robustness.py
      - run: python scripts/audit_shared_capacity.py
      - run: python scripts/audit_transport_relaxation.py
      - run: python scripts/audit_joint_plan.py
      - run: python scripts/audit_joint_travel.py
      - run: python scripts/audit_access_connectors.py
