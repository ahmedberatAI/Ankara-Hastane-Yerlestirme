name: Validate application
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: python -m pytest -q tests
      - run: npm run build
      - run: python scripts/verify_motis.py
      - run: python scripts/verify_hybrid.py
      - run: python scripts/verify_release.py
      - run: python scripts/verify_transit.py
      - run: python scripts/audit_robustness.py
      - run: python scripts/audit_shared_capacity.py
      - run: python scripts/audit_transport_relaxation.py
      - run: python scripts/audit_joint_plan.py
      - run: python scripts/audit_joint_travel.py
      - run: python scripts/audit_access_connectors.py
      - run: python scripts/audit_window_plan.py --certificate data/processed/departure-window-plan/window-plan.json --manifest data/processed/departure-window/manifest.json --summary data/processed/window-plan-summary.json --quiet
      - run: python scripts/manifest.py --check
      - run: node tests/window_plan_ui.mjs
      - run: node tests/hybrid_ui.mjs
