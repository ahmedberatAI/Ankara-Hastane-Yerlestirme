name: Publish precomputed city atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: python -m pytest -q tests/test_publication.py
      - run: node tests/publication_client.mjs
      - run: node tests/permanent_ui.mjs
      - run: npm run build:pages
      - uses: actions/configure-pages@v5
        if: vars.PAGES_DEPLOY == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: vars.PAGES_DEPLOY == 'true'
        with:
          path: dist-pages
  deploy:
    if: vars.PAGES_DEPLOY == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
